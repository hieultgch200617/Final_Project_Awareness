// ─────────────────────────────────────────────
//  App-level build.gradle
//  File location: app/build.gradle
// ─────────────────────────────────────────────

plugins {
    alias(libs.plugins.android.application)

    // Connects your app to Firebase
    id 'com.google.gms.google-services'
}

// Read secrets from local.properties (git-ignored) so they never live in source code
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.awareness.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.awareness.app"
        minSdk 26                   // Android 8.0+
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // Injected from local.properties -> BuildConfig / AndroidManifest
        buildConfigField 'String', 'SAFE_BROWSING_API_KEY',
                "\"${localProps.getProperty('SAFE_BROWSING_API_KEY', '')}\""
        manifestPlaceholders = [MAPS_API_KEY: localProps.getProperty('MAPS_API_KEY', '')]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Allows us to use Java 8 features (lambdas, streams, etc.)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Enables ViewBinding — lets us access UI elements safely without findViewById
    buildFeatures {
        viewBinding true
        buildConfig  true      // needed for BuildConfig.SAFE_BROWSING_API_KEY / BuildConfig.DEBUG
    }
}

dependencies {

    // ── AndroidX Core ──────────────────────────────────────────
    implementation libs.appcompat
    implementation libs.material               // Material Design components
    implementation libs.activity
    implementation libs.constraintlayout       // Flexible layouts
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // ── Firebase BoM (Bill of Materials) ───────────────────────
    // Using BoM means all Firebase libraries share the same version automatically
    implementation platform('com.google.firebase:firebase-bom:33.1.0')

    implementation 'com.google.firebase:firebase-auth'          // Login / Register
    implementation 'com.google.firebase:firebase-firestore'     // Database (lessons, users, reports)
    implementation 'com.google.firebase:firebase-storage'       // Images & videos for lessons
    implementation 'com.google.firebase:firebase-functions'     // Phone checker (Telesign proxy)
    implementation 'com.google.firebase:firebase-messaging'     // Push notifications (daily quiz)
    implementation 'com.google.firebase:firebase-analytics'     // Usage analytics

    // ── Image Loading ───────────────────────────────────────────
    // Glide loads images from URLs efficiently (for lesson images, avatars, etc.)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ── Video Playback ──────────────────────────────────────────
    // ExoPlayer for video lessons inside Academy
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'

    // ── Networking ──────────────────────────────────────────────
    // Retrofit + OkHttp for calling Telesign & Google Safe Browsing APIs
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Gson for converting JSON responses to Java objects
    implementation 'com.google.code.gson:gson:2.10.1'

    // ── Maps (Community Alert Map) ──────────────────────────────
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    // ── UI Extras ───────────────────────────────────────────────
    // Circle image views for profile pictures & avatars
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // Lottie for smooth animations (streak fire, level up celebration, etc.)
    implementation 'com.airbnb.android:lottie:6.4.0'

    // MPAndroidChart for the Admin dashboard charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ── Testing ─────────────────────────────────────────────────
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
